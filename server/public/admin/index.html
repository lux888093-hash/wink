<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鸿玖酒庄运营中台</title>
    <meta
      name="description"
      content="高端红酒品牌运营中台，聚合酒款、提取码、发货与小程序文案管理。"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260523-05" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">跳到内容</a>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar">
        <div class="brand-card">
          <div class="brand-mark" aria-hidden="true">
            <img src="./favicon.svg" alt="" />
          </div>
          <div class="brand-copy">
            <div class="brand-name">鸿玖酒庄</div>
            <div class="brand-subtitle">高端红酒运营中台</div>
          </div>
          <div class="brand-note">酒款、提取码、发货与文案管理</div>
        </div>

        <nav class="nav-groups" aria-label="主导航">
          <div class="nav-group">
            <div class="nav-group-label">运营</div>
            <div class="nav-stack">
              <button class="nav-item is-active" type="button" data-view="overview">
                <span class="nav-item-dot"></span>
                <span>运营概览</span>
              </button>
              <button class="nav-item" type="button" data-view="wines">
                <span class="nav-item-dot"></span>
                <span>酒款管理</span>
              </button>
              <button class="nav-item" type="button" data-view="codes">
                <span class="nav-item-dot"></span>
                <span>提取码管理</span>
              </button>
              <button class="nav-item" type="button" data-view="shipping">
                <span class="nav-item-dot"></span>
                <span>发货管理</span>
              </button>
              <button class="nav-item" type="button" data-view="copy">
                <span class="nav-item-dot"></span>
                <span>小程序文案</span>
              </button>
            </div>
          </div>

          <div class="nav-group nav-group-muted">
            <div class="nav-group-label">扩展模块</div>
            <div class="nav-stack">
              <button class="nav-item is-disabled" type="button" disabled>
                <span class="nav-item-dot"></span>
                <span>商品与库存</span>
              </button>
              <button class="nav-item is-disabled" type="button" disabled>
                <span class="nav-item-dot"></span>
                <span>会员用户</span>
              </button>
              <button class="nav-item is-disabled" type="button" disabled>
                <span class="nav-item-dot"></span>
                <span>活动运营</span>
              </button>
              <button class="nav-item is-disabled" type="button" disabled>
                <span class="nav-item-dot"></span>
                <span>审计记录</span>
              </button>
            </div>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="admin-card">
            <div class="admin-card-top">
              <div class="admin-avatar" id="sidebar-avatar">A</div>
              <div class="admin-meta">
                <div class="admin-name" id="sidebar-user">Admin</div>
                <div class="admin-role" id="sidebar-role">运营管理员</div>
              </div>
            </div>
            <div class="admin-card-bottom">
              <span id="sidebar-session">未登录</span>
              <span id="sidebar-health">离线</span>
            </div>
          </div>
        </div>
      </aside>

      <div class="content-shell">
        <header class="topbar">
          <div class="topbar-copy">
            <div class="topbar-kicker" id="topbar-kicker">鸿玖酒庄 · 运营中台</div>
            <h1 class="topbar-title" id="view-title">运营概览</h1>
            <p class="topbar-description" id="view-description">
              查看酒款、提取码、发货与小程序内容状态。
            </p>
          </div>
          <div class="topbar-actions">
            <div class="session-pill" id="session-pill" hidden>未登录</div>
            <div class="topbar-action-group" id="topbar-actions"></div>
          </div>
        </header>

        <div class="status-banner" id="status-banner" aria-live="polite"></div>

        <main class="workspace" id="app-main">
          <section class="page is-active" id="page-overview" aria-label="运营概览"></section>
          <section class="page" id="page-wines" aria-label="酒款管理"></section>
          <section class="page" id="page-codes" aria-label="提取码管理"></section>
          <section class="page" id="page-shipping" aria-label="发货管理"></section>
          <section class="page" id="page-copy" aria-label="小程序文案"></section>
        </main>
      </div>
    </div>

    <div class="drawer-layer" id="drawer-layer" hidden>
      <div class="drawer-backdrop" data-close-drawer></div>
      <aside class="drawer-panel" id="drawer-panel" role="dialog" aria-modal="true" aria-label="详情"></aside>
    </div>

    <div class="modal-layer" id="modal-layer" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-panel" id="modal-panel" role="dialog" aria-modal="true" aria-label="编辑"></section>
    </div>

    <div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="true"></div>

    <div class="login-overlay" id="login-overlay">
      <div class="login-card">
        <div class="login-visual">
          <div class="login-visual-copy">
            <div class="login-eyebrow">Hongjiu Estate</div>
            <h2 class="login-title">鸿玖酒庄运营中台</h2>
            <p class="login-copy">面向酒款、提取码、发货与小程序文案的品牌化工作台。</p>
          </div>
        </div>

        <form id="login-form" class="login-form">
          <div class="form-block">
            <label>
              <span>账号</span>
              <input id="login-username" type="text" value="curator" autocomplete="username" />
            </label>
            <label>
              <span>密码</span>
              <input
                id="login-password"
                type="password"
                value="Curator!2026"
                autocomplete="current-password"
              />
            </label>
          </div>
          <button class="button button-primary" type="submit">
            <span class="button-icon" aria-hidden="true">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
            </span>
            <span>登录</span>
          </button>
          <p class="login-error" id="login-error"></p>
        </form>
      </div>
    </div>

    <script src="./app.js?v=20260523-05"></script>
  </body>
</html>
